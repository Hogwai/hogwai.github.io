name: PR check

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  BUILD_PATH: "."

jobs:
  lint-and-build:
    name: lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "${{ env.BUILD_PATH }}/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.BUILD_PATH }}

      - name: Lint
        run: npm run lint
        working-directory: ${{ env.BUILD_PATH }}

      - name: Spell check (changed files only)
        run: |
          git diff --name-only origin/main...${{ github.event.pull_request.head.sha }} -- '*.md' | \
            xargs --no-run-if-empty npx cspell
        working-directory: ${{ env.BUILD_PATH }}

      - name: Check links in changed files
        run: |
          git diff --name-only origin/main...${{ github.event.pull_request.head.sha }} -- '*.md' '*.mdx' | \
            xargs --no-run-if-empty node scripts/check-links.mjs
        working-directory: ${{ env.BUILD_PATH }}

      - name: Astro check
        run: npx --no-install astro check
        working-directory: ${{ env.BUILD_PATH }}

      - name: Build
        run: npx --no-install astro build --site "https://example.com" --base "/"
        working-directory: ${{ env.BUILD_PATH }}